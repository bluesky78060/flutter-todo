name: Build Windows Calendar Widget

on:
  push:
    branches: [ main ]
    # 이 빌드는 lib/main_widget.dart 진입점에서 도달 가능한 **전체 그래프**를
    # 컴파일한다. 예전 필터는 lib/platforms/windows/** 와 main_widget.dart 만
    # 보고 있어서, 그 밖의 코드가 깨져도 워크플로가 트리거되지 않았다.
    #
    # 실제로 그래서 두 개의 결함이 9개월간(2025-12-08 ~ 2026-08-25) 잠복했다:
    # todo_providers.dart 의 타입 승격 오류(DTA-2-6)와 permission_handler_windows
    # 의 /await 플래그(DTA-2-7). 앞의 것을 걷어내야 뒤의 것이 보였다.
    #
    # 필터를 컴파일 범위에 맞춘다. lib 전체, 네이티브 쪽(windows/), 의존성
    # 해석에 영향을 주는 pubspec 을 포함한다.
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-windows-widget.yml'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true

      - name: Create .env file
        run: |
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > .env
          echo "NAVER_MAPS_CLIENT_ID=${{ secrets.NAVER_MAPS_CLIENT_ID }}" >> .env
          echo "NAVER_LOCAL_SEARCH_CLIENT_ID=${{ secrets.NAVER_LOCAL_SEARCH_CLIENT_ID }}" >> .env
          echo "NAVER_LOCAL_SEARCH_CLIENT_SECRET=${{ secrets.NAVER_LOCAL_SEARCH_CLIENT_SECRET }}" >> .env
          echo "SUPABASE_URL=${{ secrets.APP_SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.APP_SUPABASE_ANON_KEY }}" >> .env
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows platform
        run: flutter create --platforms=windows .

      - name: Build Windows Widget
        run: flutter build windows --release -t lib/main_widget.dart

      - name: Create Windows icon (if exists)
        run: |
          if (Test-Path "assets/icon/app_icon.ico") {
            Copy-Item "assets/icon/app_icon.ico" "build/windows/x64/runner/Release/"
          }
        shell: powershell

      - name: Copy .env to Release folder
        run: |
          Copy-Item ".env" "build/windows/x64/runner/Release/"
        shell: powershell

      - name: Copy assets to Release folder
        run: |
          if (Test-Path "assets") {
            Copy-Item -Recurse "assets" "build/windows/x64/runner/Release/"
          }
        shell: powershell

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoDo-Calendar-Widget-Windows
          path: build/windows/x64/runner/Release/
          retention-days: 30

      - name: Package for Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath ../../../../../DoDo-Calendar-Widget-Windows.zip
        shell: powershell

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: DoDo-Calendar-Widget-Windows.zip
          name: DoDo Calendar Widget ${{ github.ref_name }}
          body: |
            ## DoDo Calendar Widget for Windows

            Windows 데스크톱용 캘린더 위젯입니다.

            ### 설치 방법
            1. `DoDo-Calendar-Widget-Windows.zip` 다운로드
            2. 원하는 폴더에 압축 해제
            3. `todo_app.exe` 실행

            ### 기능
            - 월간 캘린더 보기
            - 날짜별 할 일 표시
            - 빠른 할 일 추가
            - 시스템 트레이 지원
            - 항상 위에 표시 옵션
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
