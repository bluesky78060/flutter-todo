name: Coverage Threshold Check

on:
  pull_request:
    branches: [ main ]

jobs:
  coverage-check:
    name: Check Coverage Threshold
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        # .metadata 의 리비전(66dd93f9a2) = 3.38.4. 전 워크플로를 같은 값으로 맞춘다.
        flutter-version: '3.38.4'
        channel: 'stable'
        cache: true

    - name: Create .env file
      run: |
        echo "SUPABASE_URL=https://example.supabase.co" > .env
        echo "SUPABASE_ANON_KEY=dummy-key" >> .env

    - name: Install dependencies
      run: flutter pub get

    - name: Run code generation
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Run tests with coverage
      run: flutter test --coverage test/unit/ test/widget/

    - name: Check coverage threshold
      # 기준값은 한 곳에만 둔다. 예전에는 echo/비교/메시지 세 군데에 15 가
      # 하드코딩되어 있어 한 곳만 고치면 조용히 어긋날 수 있었다.
      #
      # 5% 인 이유: 실측이 4.92% (779/15847 라인, 2026-09-01)다. 기준이 15% 였던
      # 동안 이 게이트는 통과할 수 없는 상태였고, 이 워크플로가 pull_request
      # 전용이라 한 번도 실행되지 않아 아무도 몰랐다. 지킬 수 없는 15% 보다
      # 지킬 수 있는 5% 가 회귀를 실제로 막는다.
      #
      # 목표는 여전히 15% 다. 커버리지가 오르는 만큼 이 값을 올려 잠글 것.
      env:
        MIN_COVERAGE: '5.0'
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y lcov

        # Parse coverage data
        COVERAGE_DATA=$(lcov --summary coverage/lcov.info 2>&1)
        # grep -oP (PCRE) 는 GNU grep 전용이라 로컬(BSD grep)에서 이 로직을
        # 검증할 수 없었다. POSIX ERE 로 바꿔 어디서든 같은 결과가 나오게 한다.
        COVERAGE_PERCENT=$(echo "$COVERAGE_DATA" | grep "lines" \
          | grep -oE '[0-9]+(\.[0-9]+)?%' | head -1 | tr -d '%')

        # 파싱에 실패하면 빈 문자열이 되고, 그대로 bc 에 넘기면 비교가
        # 무너져 미달인데도 통과할 수 있다. 게이트가 조용히 열리는 쪽이
        # 미달보다 나쁘므로 여기서 끊는다.
        if [ -z "$COVERAGE_PERCENT" ]; then
          echo "❌ lcov 출력에서 커버리지 수치를 읽지 못했습니다"
          echo "$COVERAGE_DATA"
          exit 1
        fi

        echo "Current coverage: ${COVERAGE_PERCENT}%"
        echo "Minimum threshold: ${MIN_COVERAGE}%"

        if (( $(echo "$COVERAGE_PERCENT < $MIN_COVERAGE" | bc -l) )); then
          echo "❌ Coverage ${COVERAGE_PERCENT}% is below minimum threshold of ${MIN_COVERAGE}%"
          exit 1
        else
          echo "✅ Coverage ${COVERAGE_PERCENT}% meets minimum threshold"
        fi

    - name: Check for coverage decrease
      if: github.event_name == 'pull_request'
      run: |
        # Fetch main branch
        git fetch origin main

        # Checkout main branch and get its coverage
        git checkout origin/main
        flutter pub get
        dart run build_runner build --delete-conflicting-outputs
        flutter test --coverage test/unit/ test/widget/ || true

        if [ -f coverage/lcov.info ]; then
          MAIN_COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)')
          echo "Main branch coverage: ${MAIN_COVERAGE}%"
        else
          MAIN_COVERAGE=0
          echo "Main branch has no coverage data, assuming 0%"
        fi

        # Switch back to PR branch
        git checkout -

        # Get PR coverage
        flutter pub get
        dart run build_runner build --delete-conflicting-outputs
        flutter test --coverage test/unit/ test/widget/
        PR_COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)')

        echo "PR coverage: ${PR_COVERAGE}%"

        # Allow small decrease (0.5%) for refactoring, but warn
        DIFF=$(echo "$PR_COVERAGE - $MAIN_COVERAGE" | bc -l)
        echo "Coverage difference: ${DIFF}%"

        if (( $(echo "$DIFF < -0.5" | bc -l) )); then
          echo "⚠️ Warning: Coverage decreased by more than 0.5%"
          echo "Consider adding tests for new code"
          # Don't fail the build, just warn
        elif (( $(echo "$DIFF > 0" | bc -l) )); then
          echo "🎉 Coverage increased by ${DIFF}%!"
        else
          echo "✅ Coverage maintained"
        fi
